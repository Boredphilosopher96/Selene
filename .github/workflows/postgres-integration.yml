name: PostgreSQL integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL 17 persistence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: selene
          POSTGRES_USER: selene
          POSTGRES_PASSWORD: selene
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selene -d selene"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run PostgreSQL persistence integration
        run: bun run --cwd apps/collaboration-service integration:postgres
        env:
          DATABASE_URL: postgres://selene:selene@localhost:5432/selene
          COLLABORATION_STORE: postgres
          COLLABORATION_SHARE_SECRET: 01234567890123456789012345678901
          COLLABORATION_PROXY_SECRET: 01234567890123456789012345678901
