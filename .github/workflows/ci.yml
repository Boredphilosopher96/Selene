name: Selene continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check formatting
        run: bun run format
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build workspace
        run: bun run build
      - name: Build Storybook
        run: bun run build-storybook
      - name: Check emitted-size budgets
        run: bun run check:emitted-size
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: bun run test:e2e
      - name: Startup budget
        run: bun run test:startup
      - name: Accessibility gates
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" bun run test:a11y
