name: Selene continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify esbuild lock resolution
        run: bun run check:esbuild-lock
      - name: Audit dependencies
        run: bun run audit:dependencies
      - name: Verify offline governance policy
        run: bun run verify:governance
      - name: Check formatting
        run: bun run format
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build workspace
        run: bun run build
      - name: Audit UI public API and bundle cost
        run: bun run audit:ui
      - name: Build Storybook
        run: bun run build-storybook
      - name: Record emitted-size advisory telemetry
        run: bun run report:emitted-size
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: bun run test:e2e
      - name: Startup budget
        run: bun run test:startup
      - name: Web and Storybook accessibility gates
        run: bun run test:a11y:web
      - name: Visual regression gates
        run: bun run test:visual
      - name: Upload visual-regression diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diagnostics-${{ github.run_id }}
          path: |
            test-results
            apps/a11y/storybook-visual.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 7

  assembled-pages-review:
    name: Assembled Pages review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build web demo for Pages
        env:
          VITE_BASE_PATH: /Selene/demo/
        run: bun run --cwd apps/web build
      - name: Build Storybook for Pages assembly
        env:
          STORYBOOK_BASE_PATH: /Selene/storybook/
        run: bun run build-storybook
      - name: Assemble Pages site
        run: bun run prepare-pages
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Exercise assembled review routes
        run: bunx playwright test --config playwright.pages.config.ts
      - name: Upload assembled review evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: assembled-review-evidence-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  desktop-flow-evidence:
    name: Desktop Flow evidence
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install Playwright browser
        run: bunx playwright install chromium
      - name: Capture packaged desktop Flow evidence
        run: bun run --cwd apps/desktop test:e2e:flow
      - name: Upload desktop Flow review captures
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-flow-review-${{ github.run_id }}
          path: |
            test-results/prototype-flow-*.png
            apps/desktop/test-results/prototype-flow-*/workspace-toolbar-diagnostics-evidence.json
            apps/desktop/test-results/prototype-flow-*/attachments/workspace-toolbar-diagnostics-evidence.json
          if-no-files-found: error
          retention-days: 7
      - name: Upload desktop Flow failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-flow-failure-${{ github.run_id }}
          path: |
            apps/desktop/test-results/prototype-flow-*/error-context.md
            apps/desktop/test-results/prototype-flow-*/trace.zip
            apps/desktop/test-results/prototype-flow-*/test-failed-*.png
            apps/desktop/test-results/prototype-flow-*/attachments/desktop-startup-output.txt
            apps/desktop/test-results/prototype-flow-*/workspace-toolbar-diagnostics-evidence.json
            apps/desktop/test-results/prototype-flow-*/attachments/workspace-toolbar-diagnostics-evidence.json
          if-no-files-found: error
          retention-days: 7

  desktop-electron-behavior:
    name: macOS Electron behavior
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run packaged desktop behavior tests
        run: bun run --cwd apps/desktop test:e2e
      - name: Upload desktop privacy diagnostics evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-privacy-diagnostics-${{ github.run_id }}
          path: apps/desktop/test-results/**/desktop-privacy-diagnostics-evidence.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload Electron behavior diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-electron-behavior-failure-${{ github.run_id }}
          path: apps/desktop/test-results
          if-no-files-found: error
          retention-days: 7

  electron-accessibility:
    name: macOS Electron accessibility
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Audit the built Electron workspace
        run: bun run test:a11y:electron
      - name: Upload Electron accessibility diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: electron-accessibility-diagnostics-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  windows-harness-supervisor:
    name: Windows harness supervisor
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify Windows Job Object supervisor
        run: bun run test:harness:windows
