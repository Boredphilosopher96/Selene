name: Selene continuous integration

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify offline governance policy
        run: bun run verify:governance
      - name: Check formatting
        run: bun run format
      - name: Lint
        run: bun run lint
      - name: Type-check
        run: bun run typecheck
      - name: Unit tests
        run: bun run test
      - name: Build workspace
        run: bun run build
      - name: Audit UI public API and bundle cost
        run: bun run audit:ui
      - name: Build Storybook
        run: bun run build-storybook
      - name: Check emitted-size budgets
        run: bun run check:emitted-size
      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium
      - name: Browser smoke tests
        run: bun run test:e2e
      - name: Startup budget
        run: bun run test:startup
      - name: Accessibility gates
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" bun run test:a11y
      - name: Visual regression gates
        run: bun run test:visual
      - name: Upload visual-regression diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-diagnostics-${{ github.run_id }}
          path: |
            test-results
            apps/a11y/storybook-visual.spec.ts-snapshots
          if-no-files-found: ignore
          retention-days: 7

  windows-harness-supervisor:
    name: Windows harness supervisor
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify Windows Job Object supervisor
        run: bun run test:harness:windows
