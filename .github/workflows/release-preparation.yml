name: Selene release preparation

# This workflow deliberately never publishes packages, creates GitHub Releases,
# or uses package-registry credentials. A maintainer must dispatch it manually.
on:
  workflow_dispatch:
    inputs:
      prepare_version_pr:
        description: Create or update the Changesets version PR
        required: true
        default: true
        type: boolean
      build_electron_artifacts:
        description: Build unsigned Electron artifacts for the supported platform matrix
        required: true
        default: true
        type: boolean
      run_release_dry_run:
        description: Validate package metadata and packing without publishing
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  version-packages:
    name: Prepare Changesets version PR
    if: inputs.prepare_version_pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create version and changelog pull request
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: bun run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-dry-run:
    name: Validate package release dry run
    if: inputs.run_release_dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Validate private packages and npm packing
        run: bun run release:dry-run

  electron-artifacts:
    name: Selene Electron artifacts (${{ matrix.platform }}-${{ matrix.arch }})
    if: inputs.build_electron_artifacts
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-15-intel
            platform: macos
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Electron application
        run: bun run --cwd apps/desktop build
      # Signing is intentionally absent. Add platform credentials only after
      # this workflow is protected and the platform-specific signing runbook is approved.
      - name: Upload unsigned Electron artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Selene-desktop-${{ matrix.platform }}-${{ matrix.arch }}-${{ github.sha }}
          path: apps/desktop/out
          if-no-files-found: error
          retention-days: 30
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-path: apps/desktop/out/**
