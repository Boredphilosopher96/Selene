name: Release preparation

# This workflow deliberately never publishes packages, creates GitHub Releases,
# or uses package-registry credentials. A maintainer must dispatch it manually.
on:
  workflow_dispatch:
    inputs:
      prepare_version_pr:
        description: Create or update the Changesets version PR
        required: true
        default: true
        type: boolean

jobs:
  version-packages:
    name: Prepare Changesets version PR
    if: inputs.prepare_version_pr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e7b35af02d8e9cac7468407e90ce # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create version and changelog pull request
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: bun run version-packages
          commit: 'chore: version packages'
          title: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  electron-artifacts:
    name: Electron artifacts (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows
    steps:
      - name: Check out source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Set up Bun
        uses: oven-sh/setup-bun@735343b667d3e7b35af02d8e9cac7468407e90ce # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build Electron application
        run: bun run --cwd apps/desktop build
      # Optional signing is intentionally not configured. If signing is enabled,
      # add platform credentials only to this manually dispatched workflow.
      - name: Upload unsigned Electron artifact
        id: upload
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: selene-desktop-${{ matrix.label }}-${{ github.sha }}
          path: apps/desktop/out
          if-no-files-found: error
          retention-days: 30
      - name: Attest artifact provenance
        uses: actions/attest-build-provenance@c074443f1aee8d4aeeae555aebba3282517141b2 # v2.2.3
        with:
          subject-name: selene-desktop-${{ matrix.label }}-${{ github.sha }}
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}
